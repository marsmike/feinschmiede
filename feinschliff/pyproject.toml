[project]
name = "feinschliff"
version = "0.3.0"
description = "Feinschliff — master-template PowerPoint renderer for Claude Code."
requires-python = ">=3.11"
# Master-template kernel only — no DSL, no feinschmiede engine dep.
# (feinschmiede stays in the workspace for feinbild's diagram skills.)
dependencies = [
    "python-pptx>=1.0.2",
    "lxml>=6.1.1",
    "pillow>=12.2.0",
    "pyyaml>=6.0.3",
]

[build-system]
requires = ["setuptools>=82.0.1"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "ruff>=0.15.17",
]

[tool.ruff.lint.per-file-ignores]
"scripts/**" = ["E402"]
# Vendored, self-contained media-skill CLI scripts (copied verbatim from
# agentic-toolkit). They do __future__/sys.path setup before imports, so E402
# applies here for the same reason it does to scripts/**.
"skills/*/scripts/**" = ["E402"]

[tool.setuptools.packages.find]
where = ["."]
include = ["feinschliff*"]

[tool.setuptools.package-data]
# Non-.py runtime resources read at first-use time. Currently the bundled
# brand pack assets (master.pptx, catalogs, themes, illustrations) shipped
# inside the wheel.
feinschliff = [
    "brands/feinschliff/assets/*",
]
