name: CI

# Slimmed for the master-template migration (PR 0). The Python suite is
# being removed; the only gate that stays meaningful is progressive-
# disclosure validation of every SKILL.md via claude-skills-cli.
#
# Branch protection on main requires the status checks "DCO sign-off" and
# "feinschliff lib tests" — both job display names below must match
# exactly or PRs will hang forever waiting for the missing check.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dco:
    name: DCO sign-off
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Verify Signed-off-by on every commit
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          missing=()
          while read -r sha; do
            if ! git log -1 --format=%B "$sha" | grep -qE "^Signed-off-by: "; then
              missing+=("$sha $(git log -1 --format=%s "$sha")")
            fi
          done < <(git rev-list "$BASE_SHA..$HEAD_SHA")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Commits missing Signed-off-by line:"
            printf '  %s\n' "${missing[@]}"
            echo
            echo "Add a sign-off to every commit:"
            echo "  git commit -s -m \"your message\""
            echo "Or amend an existing commit:"
            echo "  git commit --amend --signoff"
            exit 1
          fi
          echo "OK All commits have DCO sign-off."

  feinschliff:
    # Display name MUST stay "feinschliff lib tests" — branch protection
    # on main requires that exact status. Renaming would brick PR merges.
    # Body is now skill validation, not pytest.
    name: feinschliff lib tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate every SKILL.md (progressive disclosure)
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r skill; do
            dir="$(dirname "$skill")"
            echo "── $dir"
            if ! npx -y claude-skills-cli validate "$dir"; then
              fail=1
            fi
          done < <(find . -name SKILL.md \
            -not -path '*/.venv/*' \
            -not -path '*/node_modules/*' \
            -not -path '*/.debug/*' \
            -not -path '*/wheels*')
          exit $fail
