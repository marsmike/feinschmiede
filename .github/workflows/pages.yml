name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Install soffice (LibreOffice) + poppler-utils
        # Gallery script: feinschliff -> render() -> soffice convert-to pdf
        # -> pdftoppm rasterize -> PIL atlas grid. Both binaries are
        # OS-level — easier to apt-install once than to add a Python wheel.
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice-impress poppler-utils
      - name: Install workspace (all packages)
        run: uv sync --all-packages
      - name: Render brand-gallery atlas
        # Half-CPU workers per CLAUDE.md. The runner has 4 vCPUs -> 2
        # parallel brand renders, isolated LibreOffice profiles per worker
        # so soffice instances don't race over the global profile lock.
        run: uv run --package feinschliff python feinschliff/scripts/render_gallery.py --workers 2
      - name: Add root redirect to /brands/
        run: |
          cat > docs/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>feinschmiede brand gallery</title>
          <link rel="icon" type="image/svg+xml" href="feinschmiede-mark.svg">
          <meta property="og:title" content="feinschmiede — brand gallery">
          <meta property="og:image" content="https://marsmike.github.io/feinschmiede/feinschmiede-social.png">
          <meta name="twitter:card" content="summary_large_image">
          <meta http-equiv="refresh" content="0; url=brands/">
          <link rel="canonical" href="brands/">
          <p>Redirecting to the <a href="brands/">feinschmiede brand gallery</a>…</p>
          HTML
      - name: Add brand assets to the Pages site
        run: cp assets/feinschmiede-mark.svg assets/feinschmiede-mark-dark.svg assets/feinschmiede-social.png docs/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
