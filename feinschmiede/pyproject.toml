[project]
name = "feinschmiede"
version = "0.3.0"
description = "feinschmiede — shared engine for the feinschmiede media family: diagram pipeline (feinbild excalidraw/svg) + brand-token loader."
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Mike Mueller", email = "mike@objektarium.de" }]
dependencies = [
    "pyyaml>=6.0.3",
    "cairosvg>=2.9.0",
    "rough>=1.6",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["feinschmiede*"]

[tool.setuptools.package-data]
# Playwright assets are the diagram pipeline's rendering shell.
feinschmiede = ["diagrams/playwright_assets/*.html"]
